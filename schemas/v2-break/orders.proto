syntax = "proto3";

package shop;
option csharp_namespace = "EncodingLab.Contracts";

import "google/protobuf/timestamp.proto";

enum OrderStatus{
    ORDER_STATUS_UNSPECIFIED = 0;
    ORDER_STATUS_PENDING = 1;
    ORDER_STATUS_CONFIRMED = 2;
    ORDER_STATUS_DENIED = 3;
}

message Address{
    string city = 1;
    string street = 2;
    string postal_code = 3;
}

message OrderItem{
    string product_id = 1;
    int32 quantity = 2;
    sint32 price_per_unit = 3;
}

message Order{
    string id = 1;
    string customer_id = 2;
    google.protobuf.Timestamp created_at = 3;
    OrderStatus status = 4;
    Address address = 5;
    repeated OrderItem order_items = 6;
    optional string comment = 7;
}

//transport a
service OrderService{
    rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
    rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
    rpc GetCustomerOrders(GetCustomerOrdersRequest) returns (GetCustomerOrdersResponse);
}

message CreateOrderRequest{
    string request_id = 1;
    Order order = 2;
}

message CreateOrderResponse{
    Order order = 1;
}

message GetOrderRequest{
    string order_id = 1;
}

message GetOrderResponse{
    Order order = 1;
}

message GetCustomerOrdersRequest{
    string customer_id = 1;
}

message GetCustomerOrdersResponse{
    repeated Order orders = 1;
}

//transport b
message OrderCreated{
    Order order = 1;
}

message OrderProcessed{
    string order_id = 1;
    OrderStatus status = 2;
    google.protobuf.Timestamp timestamp = 3;
}
